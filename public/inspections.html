<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION-X — Inspections</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>

  <div class="wrap">
    <h1>Inspections</h1>
    <p class="sub">Admins randomly assign pending inspections; PMU officers see only what's assigned to them.</p>

    <div id="msgBox"></div>

    <div class="actions-row" id="adminActions"></div>

    <div class="panel">
      <input type="text" id="searchBox" placeholder="Search by institute, district, or status…" style="margin-bottom:14px; width:100%; max-width:360px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; background:var(--paper-dim); color:var(--ink); font-family:var(--sans); font-size:0.9rem;">
      <table>
        <thead><tr><th>Institute</th><th>District</th><th>Assigned to</th><th>Status</th><th>Due</th><th></th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Admin-only edit panel: due date + manual reassignment -->
  <div id="editOverlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50;">
    <div class="panel" style="width:100%; max-width:420px; margin:0;">
      <h2>Edit inspection</h2>
      <div id="editMsg"></div>
      <form class="stacked" id="editForm">
        <input type="hidden" id="edit_id">
        <label>Due date</label>
        <input type="date" id="edit_due">
        <label>Assigned PMU officer</label>
        <select id="edit_officer">
          <option value="">— Unassigned (back to pending) —</option>
        </select>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button type="submit" class="btn" id="editSaveBtn">Save changes</button>
          <button type="button" class="btn secondary" id="editCancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const user = VX.requireAuth();
    VX.renderTopbar('inspections');

    if (user && (user.role === 'admin' || user.role === 'authority')) {
      document.getElementById('adminActions').innerHTML = `
        <button class="btn" id="assignBtn">Randomly assign pending inspections</button>
      `;
      document.getElementById('assignBtn').addEventListener('click', async () => {
        const btn = document.getElementById('assignBtn');
        btn.disabled = true;
        btn.textContent = 'Assigning…';
        try {
          const result = await VX.request('/inspections/assign-random', { method: 'POST' });
          showMsg(result.message, 'success');
          loadInspections();
        } catch (err) {
          showMsg(err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Randomly assign pending inspections';
        }
      });
    }

    function showMsg(text, type) {
      document.getElementById('msgBox').innerHTML = `<div class="msg ${type}">${text}</div>`;
    }

    async function updateStatus(id, status) {
      try {
        await VX.request(`/inspections/${id}/status`, { method: 'PATCH', body: { status } });
        loadInspections();
      } catch (err) {
        showMsg(err.message, 'error');
      }
    }

    // ---- Admin-only: edit (due date / manual reassignment) and delete ----
    let pmuOfficers = [];

    async function loadPmuOfficers() {
      if (!user || user.role !== 'admin') return;
      try {
        const { users } = await VX.request('/auth/users');
        pmuOfficers = users.filter((u) => u.role === 'pmu');
      } catch (err) {
        // Non-fatal: the edit modal will just show no officer options.
      }
    }

    function openEditModal(inspection) {
      document.getElementById('edit_id').value = inspection.id;
      document.getElementById('edit_due').value = inspection.due_date || '';
      const select = document.getElementById('edit_officer');
      select.innerHTML = '<option value="">— Unassigned (back to pending) —</option>' +
        pmuOfficers.map((o) => `<option value="${o.id}" ${o.id === inspection.assigned_to ? 'selected' : ''}>${o.name}</option>`).join('');
      document.getElementById('editMsg').innerHTML = '';
      document.getElementById('editOverlay').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editOverlay').classList.add('hidden');
    }

    document.getElementById('editCancelBtn')?.addEventListener('click', closeEditModal);

    document.getElementById('editForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit_id').value;
      const dueDate = document.getElementById('edit_due').value || null;
      const officerVal = document.getElementById('edit_officer').value;
      const assignedTo = officerVal === '' ? null : Number(officerVal);

      try {
        await VX.request(`/inspections/${id}`, { method: 'PUT', body: { dueDate, assignedTo } });
        closeEditModal();
        showMsg('Inspection updated.', 'success');
        loadInspections();
      } catch (err) {
        document.getElementById('editMsg').innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });

    async function deleteInspection(id) {
      if (!confirm('Delete this inspection? This cannot be undone.')) return;
      try {
        await VX.request(`/inspections/${id}`, { method: 'DELETE' });
        showMsg('Inspection deleted.', 'success');
        loadInspections();
      } catch (err) {
        showMsg(err.message, 'error');
      }
    }

    let allInspections = [];

    function renderInspections(list) {
      const tbody = document.getElementById('tableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">No inspections match.</td></tr>';
        return;
      }
      window._inspectionsById = {};
      list.forEach((i) => { window._inspectionsById[i.id] = i; });

      tbody.innerHTML = list.map((i) => {
        const mine = user.role === 'pmu' && i.assigned_to === user.id;
        const canStart = mine && (i.status === 'assigned');
        const canReport = mine && (i.status === 'in_progress' || i.status === 'assigned');
        const isAdmin = user.role === 'admin';
        return `
          <tr>
            <td>${i.institute_name}</td>
            <td>${i.district}</td>
            <td>${i.assignee_name || '—'}</td>
            <td><span class="status ${i.status}">${i.status.replace('_',' ')}</span></td>
            <td>${i.due_date || '—'}</td>
            <td>
              ${canStart ? `<button class="btn small" onclick="updateStatus(${i.id}, 'in_progress')">Start</button>` : ''}
              ${canReport ? ` <a class="btn small secondary" href="/report-submit.html?inspectionId=${i.id}">Submit report</a>` : ''}
              ${isAdmin ? ` <button class="btn small secondary" onclick='openEditModal(window._inspectionsById[${i.id}])'>Edit</button> <button class="btn small secondary" onclick="deleteInspection(${i.id})">Delete</button>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function loadInspections() {
      try {
        const data = await VX.request('/inspections');
        allInspections = data.inspections;
        applyInspectionFilter();
      } catch (err) {
        showMsg(err.message, 'error');
      }
    }

    function applyInspectionFilter() {
      const box = document.getElementById('searchBox');
      const q = (box && box.value || '').trim().toLowerCase();
      const filtered = !q ? allInspections : allInspections.filter((i) =>
        [i.institute_name, i.district, i.status, i.assignee_name].some((f) => (f || '').toLowerCase().includes(q))
      );
      renderInspections(filtered);
    }

    document.getElementById('searchBox')?.addEventListener('input', applyInspectionFilter);

    loadInspections();
    loadPmuOfficers();
  </script>
</body>
</html>
